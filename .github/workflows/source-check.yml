name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run audit:repo
      - run: python -m pip install -r source/requirements-build.txt
      - run: python -m compileall -q source scripts
      - run: npm run build
      - run: npm run audit:repo
